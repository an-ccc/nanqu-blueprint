<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>彰化南區科技藍圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D toy diorama; soft paper cards float at the corners like labels on a music box. Single warm look on purpose. */
:root{
  color-scheme: light;
  --bg:#8c827a;
  --paper:#f7f2e8;
  --paper-2:#ece4d4;
  --ink:#3b332d;
  --muted:#7b6e63;
  --sage:#5f7d55;
  --sage-soft:#dfe8d3;
  --wood:#d39a55;
  --alert:#d9443a;
  --alert-soft:#fbe0db;
  --amber:#c98a22;
  --amber-soft:#f8ead0;
  --ok:#4a8f55;
  --ok-soft:#dcefdc;
  --display:"Huninn","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:fixed;inset:0}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#world:active{cursor:grabbing}
.hud{position:absolute;inset:0;pointer-events:none;display:grid;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  grid-template-columns:minmax(250px,310px) 1fr minmax(230px,280px);
  grid-template-rows:auto 1fr auto;
  grid-template-areas:"title . status" ". . status" "picker caption status"}
.hud>*{pointer-events:auto}
.card{background:color-mix(in srgb,var(--paper) 94%,transparent);border-radius:20px;padding:14px 16px;box-shadow:0 6px 22px rgba(40,30,20,.18)}
.title{grid-area:title;align-self:start}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;color:var(--sage);font-weight:700}
.cand{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.12em;color:var(--ink);margin-left:4px}
h1{margin:2px 0 4px;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;text-wrap:balance}
.sub{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.status{grid-area:status;align-self:start;display:flex;flex-direction:column;gap:10px;min-width:0}
.st{background:color-mix(in srgb,var(--paper) 94%,transparent);border-radius:18px;padding:12px 14px;box-shadow:0 6px 22px rgba(40,30,20,.16);min-width:0}
.st-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st-name{font-family:var(--display);font-size:16px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--paper-2);color:var(--muted)}
.pill.alert{background:var(--alert);color:#fff}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.st-d{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.st-d b{color:var(--ink);font-variant-numeric:tabular-nums}
.stalls{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.stalls span{height:14px;border-radius:4px;background:var(--ok-soft);border:1.5px solid var(--ok)}
.stalls span.on{background:var(--alert);border-color:var(--alert)}
.stall-lg{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.linkbtn{margin-top:8px;font:inherit;font-size:12px;font-weight:700;color:var(--sage);background:var(--sage-soft);border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.picker{grid-area:picker;align-self:end;display:flex;flex-direction:column;gap:8px}
.picker h2{margin:0;font-family:var(--display);font-weight:400;font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.row button{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--paper-2);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
.row{display:flex;gap:8px;margin-top:2px}
.row .primary{flex:1;background:var(--wood);border-color:var(--wood);color:#fff;font-family:var(--display);font-weight:400;font-size:16px;padding:8px 14px}
.row .primary.on{background:var(--ink);border-color:var(--ink)}
.hint{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.caption{grid-area:caption;align-self:end;justify-self:center;max-width:560px;width:100%;background:var(--ink);color:var(--paper);border-radius:20px;padding:12px 18px;box-shadow:0 8px 26px rgba(30,20,10,.3)}
.cap-step{font-size:11px;letter-spacing:.1em;color:#e7c48c;font-weight:700}
.caption strong{display:block;font-family:var(--display);font-weight:400;font-size:19px;margin-top:2px}
.caption p{margin:4px 0 0;font-size:14px;line-height:1.6;color:#e9e1d3}
/* phone mock */
.phone-wrap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(40,32,26,.35);pointer-events:auto;padding:16px}
.phone{width:min(300px,100%);background:#2b2522;border-radius:36px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.screen{background:var(--paper);border-radius:26px;overflow:hidden}
.ph-bar{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:10px 18px 6px;color:var(--ink)}
.ph-head{background:var(--sage);color:#fff;padding:14px 18px}
.ph-head small{font-size:12px;opacity:.85}
.ph-head h3{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:22px}
.ph-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.ph-body p{margin:0;font-size:13px;line-height:1.65;color:var(--muted)}
.smoke-btn{width:148px;height:148px;border-radius:50%;border:8px solid var(--alert-soft);background:var(--alert);color:#fff;font-family:var(--display);font-size:21px;line-height:1.3;cursor:pointer;box-shadow:0 8px 0 #a8322a;transition:transform .1s,box-shadow .1s}
.smoke-btn:active,.smoke-btn.press{transform:translateY(6px);box-shadow:0 2px 0 #a8322a}
.smoke-btn:disabled{background:#b9ada3;box-shadow:0 8px 0 #8f847b;cursor:default}
.ph-msg{font-weight:700;color:var(--ink)!important;min-height:1.6em}
.ph-close{display:block;margin:10px auto 2px;font:inherit;font-weight:700;font-size:14px;color:#efe7dc;background:none;border:0;cursor:pointer;padding:6px 14px}
@media (max-width:760px){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto;
    grid-template-areas:"title" "status" "." "caption" "picker";gap:8px}
  .card{padding:10px 14px}
  h1{font-size:22px}
  .sub,.hint{display:none}
  .status{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .st{flex:0 0 200px;padding:10px 12px}
  .caption{padding:10px 14px}
  .caption strong{font-size:16px}
  .caption p{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.smoke-btn{transition:none}}
</style>

<div id="app">
  <canvas id="world" aria-label="延平公園 3D 小世界"></canvas>
  <div class="hud">
    <header class="card title">
      <p class="eyebrow">彰化市民代表・南區候選人 <span class="cand">鄭安棋</span></p>
      <h1>南區科技藍圖</h1>
      <p class="sub">以延平公園為示範：斑馬線禮讓警示、禁菸即時廣播、公廁使用看板。拖曳旋轉、滾輪縮放，帶著你的小人偶逛一圈。</p>
    </header>

    <section class="status" aria-label="即時狀態">
      <div class="st">
        <div class="st-h"><span class="st-name">智慧斑馬線</span><span class="pill" id="pill-cross">待命</span></div>
        <p class="st-d" id="d-cross">路口目前沒有行人</p>
      </div>
      <div class="st">
        <div class="st-h"><span class="st-name">公園禁菸</span><span class="pill" id="pill-smoke">—</span></div>
        <p class="st-d" id="d-smoke">—</p>
        <button class="linkbtn" id="scan-btn" type="button">掃描柱上 QR Code</button>
      </div>
      <div class="st">
        <div class="st-h"><span class="st-name">公共廁所</span><span class="pill ok" id="pill-wc">—</span></div>
        <p class="st-d" id="d-wc">—</p>
        <div class="stalls" id="stalls"></div>
        <div class="stall-lg"><span>男 4</span><span>女 5</span><span>親子／無障礙 1</span></div>
      </div>
    </section>

    <div class="caption" id="caption" hidden>
      <span class="cap-step" id="cap-step"></span>
      <strong id="cap-title"></strong>
      <p id="cap-text"></p>
    </div>

    <section class="card picker" aria-label="角色與導覽">
      <h2>選擇你的小人偶</h2>
      <div class="seg" id="pick-kind" role="group" aria-label="角色">
        <button type="button" id="k-man" data-v="man" aria-pressed="true">男生</button>
        <button type="button" id="k-woman" data-v="woman" aria-pressed="false">女生</button>
        <button type="button" id="k-kid" data-v="kid" aria-pressed="false">小朋友</button>
      </div>
      <div class="seg" id="pick-extra" role="group" aria-label="同行">
        <button type="button" id="e-none" data-v="none" aria-pressed="true">獨自</button>
        <button type="button" id="e-stroller" data-v="stroller" aria-pressed="false">推嬰兒車</button>
        <button type="button" id="e-wheel" data-v="wheelchair" aria-pressed="false">推長輩輪椅</button>
        <button type="button" id="e-dog" data-v="dog" aria-pressed="false">帶寵物</button>
      </div>
      <div class="row">
        <button type="button" class="primary" id="tour-btn">自動導覽</button>
        <button type="button" id="sound-btn" aria-pressed="true">聲音 開</button>
      </div>
      <p class="hint">點地面走過去・WASD／方向鍵移動・點公園柱子上的 QR Code</p>
    </section>
  </div>

  <div class="phone-wrap" id="phone" hidden>
    <div class="phone" role="dialog" aria-label="掃描 QR Code 後的網頁">
      <div class="screen">
        <div class="ph-bar"><span>10:24</span><span>延平公園</span></div>
        <div class="ph-head"><small id="ph-spot">QR 點位 A-02</small><h3>禁菸提醒</h3></div>
        <div class="ph-body">
          <p>延平公園為全面禁菸場所。看到有人在園區內吸菸，按下按鈕，園區廣播會播放禁菸提醒。不需登入，不留個資。</p>
          <button type="button" class="smoke-btn" id="ph-btn">發送<br>禁菸提醒</button>
          <p class="ph-msg" id="ph-msg">　</p>
        </div>
      </div>
      <button type="button" class="ph-close" id="ph-close">關閉</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rand=rng(20261014);
const mod=(a,n)=>((a%n)+n)%n;
const FONT='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
const PARK_Y=0.45, SW_Y=0.3, ROAD_Y=0.06;

/* ---------- renderer / camera ---------- */
const canvas=$('#world');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8c827a);
const camera=new THREE.PerspectiveCamera(34,1,0.5,400);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.maxPolarAngle=1.3; controls.minDistance=8; controls.maxDistance=140;
const narrow=()=>innerWidth/innerHeight<1;
const VIEW={overview:[[0,46,56],[0,0,3]],cross:[[13,13,33],[0,0.5,14]],smoke:[[-1,8,15],[-5.4,1.2,3.6]],wc:[[13,8.5,5],[6.3,2.2,-6]]};
function viewPos(v){const [p,t]=VIEW[v];const T=new THREE.Vector3(...t),P=new THREE.Vector3(...p);if(narrow())P.sub(T).multiplyScalar(1.7).add(T);return [P,T];}
{const [P,T]=viewPos('overview');camera.position.copy(P);controls.target.copy(T);}

scene.add(new THREE.HemisphereLight(0xfff4e2,0x7d6f62,0.8));
const sun=new THREE.DirectionalLight(0xffe6c8,0.72);
sun.position.set(-22,42,26); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:120}); sun.shadow.bias=-0.0006;
scene.add(sun);
const fillL=new THREE.DirectionalLight(0xdfe8ff,0.22); fillL.position.set(25,20,-20); scene.add(fillL);

/* ---------- helpers ---------- */
const matCache={};
const mat=c=>matCache[c]||(matCache[c]=new THREE.MeshStandardMaterial({color:c,roughness:0.9,metalness:0}));
function add(geo,color,x=0,y=0,z=0,parent=scene,shadow=true){
  const m=new THREE.Mesh(geo,typeof color==='number'?mat(color):color);
  m.position.set(x,y,z); m.castShadow=shadow; m.receiveShadow=true; parent.add(m); return m;
}
function rrShape(hw,hh,r,s=new THREE.Shape()){
  s.moveTo(-hw+r,-hh);s.lineTo(hw-r,-hh);s.quadraticCurveTo(hw,-hh,hw,-hh+r);s.lineTo(hw,hh-r);
  s.quadraticCurveTo(hw,hh,hw-r,hh);s.lineTo(-hw+r,hh);s.quadraticCurveTo(-hw,hh,-hw,hh-r);
  s.lineTo(-hw,-hh+r);s.quadraticCurveTo(-hw,-hh,-hw+r,-hh);return s;
}
function rbox(w,h,d,r){
  r=Math.min(r,w*0.45,h*0.45,d*0.45);
  const hw=w/2-r,hh=h/2-r;
  const g=new THREE.ExtrudeGeometry(rrShape(hw,hh,Math.min(hw,hh)*0.5),{depth:Math.max(d-2*r,0.001),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:3,curveSegments:6});
  g.center(); return g;
}
// rounded-rect inside test (true circle corners)
function inRR(x,z,h,r){const qx=Math.abs(x)-(h-r),qz=Math.abs(z)-(h-r);return Math.hypot(Math.max(qx,0),Math.max(qz,0))+Math.min(Math.max(qx,qz),0)-r<0;}
function groundY(x,z){if(inRR(x,z,11.1,3.1))return PARK_Y;if(inRR(x,z,17,9))return ROAD_Y;if(inRR(x,z,19.5,11.5))return SW_Y;return 0;}
function canvasTex(w,h){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const tex=new THREE.CanvasTexture(cv);tex.anisotropy=4;return {cv,ctx:cv.getContext('2d'),tex};}
function roundRect(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();}

/* ---------- base: music-box disk ---------- */
add(new THREE.LatheGeometry([[33.6,-4],[33.6,0.9],[34.2,1.5],[36,1.5],[36.8,0.8],[36.8,-4]].map(p=>new THREE.Vector2(p[0],p[1])),96),0xf0dcc8);
add(new THREE.CylinderGeometry(33.8,33.8,1,96),0xd59d58,0,-0.5,0,scene,false);
for(let i=0;i<16;i++){ // wood grain swirls
  const a=rand()*Math.PI*2,rr=23+rand()*8.5,R=1.5+rand()*4.5;
  const t=add(new THREE.TorusGeometry(R,0.07,6,60,Math.PI*(0.6+rand()*0.9)),0xbf8646,Math.cos(a)*rr,0.01,Math.sin(a)*rr,scene,false);
  t.rotation.x=-Math.PI/2; t.rotation.z=rand()*6;
}
function slab(shape,depth,bevel,color){
  const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:bevel>0,bevelThickness:bevel,bevelSize:bevel,bevelSegments:3,curveSegments:24});
  g.rotateX(-Math.PI/2); return add(g,color,0,bevel,0,scene,false);
}
slab(rrShape(17,17,9),ROAD_Y,0,0x6f6762);
const sw=rrShape(19.5,19.5,11.5); sw.holes.push(rrShape(17,17,9,new THREE.Path())); slab(sw,0.2,0.05,0xf1e4cb);
slab(rrShape(11,11,3),0.15,0.15,0xa6bb80);

/* ---------- lanes & crossings ---------- */
function makeLoop(h,r,rev){
  const pts=[],seg=14,c=h-r;
  for(const [cx,cz,a0] of [[c,c,0],[-c,c,Math.PI/2],[-c,-c,Math.PI],[c,-c,Math.PI*1.5]])
    for(let i=0;i<=seg;i++){const a=a0+i/seg*Math.PI/2;pts.push({x:cx+r*Math.cos(a),z:cz+r*Math.sin(a)});}
  if(rev)pts.reverse();
  const n=pts.length,cum=[0];
  for(let i=0;i<n;i++){const b=pts[(i+1)%n];cum.push(cum[i]+Math.hypot(b.x-pts[i].x,b.z-pts[i].z));}
  const L=cum[n];
  const loop={h,L,at(s){s=mod(s,L);let i=0;while(cum[i+1]<s)i++;const a=pts[i],b=pts[(i+1)%n],t=(s-cum[i])/((cum[i+1]-cum[i])||1);return {x:a.x+(b.x-a.x)*t,z:a.z+(b.z-a.z)*t,dx:b.x-a.x,dz:b.z-a.z};},
    nearestS(x,z){let best=0,bd=1e9;for(let s=0;s<L;s+=0.1){const p=this.at(s),d=(p.x-x)**2+(p.z-z)**2;if(d<bd){bd=d;best=s;}}return best;}};
  return loop;
}
// crossing i: d = outward walking direction, p = road direction
const CROSS=[{dx:0,dz:-1,name:'北側'},{dx:0,dz:1,name:'南側'},{dx:1,dz:0,name:'東側'},{dx:-1,dz:0,name:'西側'}].map(c=>({...c,px:-c.dz,pz:c.dx}));
const stripeG=new THREE.BoxGeometry(3,0.03,0.5);
CROSS.forEach(c=>{for(let k=0;k<6;k++){const a=11.6+k*0.95;const m=add(stripeG,0xf7f3ea,c.dx*a,ROAD_Y+0.01,c.dz*a,scene,false);m.rotation.y=Math.atan2(-c.pz,c.px);}});
const crossingAt=(x,z)=>{for(let i=0;i<4;i++){const c=CROSS[i],al=x*c.dx+z*c.dz,ac=x*c.px+z*c.pz;if(al>9.6&&al<19.4&&Math.abs(ac)<2.2)return i;}return -1;};
const mid=makeLoop(14,6,false); const midCS=CROSS.map(c=>mid.nearestS(c.dx*14,c.dz*14));
const dashG=new THREE.BoxGeometry(0.14,0.03,1);
for(let s=0;s<mid.L;s+=2.2){
  if(midCS.some(cs=>Math.min(mod(cs-s,mid.L),mod(s-cs,mid.L))<3))continue;
  const p=mid.at(s);const m=add(dashG,0xe9d9a0,p.x,ROAD_Y+0.01,p.z,scene,false);m.rotation.y=Math.atan2(p.dx,p.dz);
}
const lanes=[makeLoop(12.6,4.6,false),makeLoop(15.4,7.4,true)];
lanes.forEach(l=>l.cs=CROSS.map(c=>l.nearestS(c.dx*l.h,c.dz*l.h)));

/* ---------- electronic warning signs ---------- */
const signs=CROSS.map((c,i)=>{
  const t=canvasTex(256,104);
  const face=new THREE.MeshBasicMaterial({map:t.tex});
  const lamp=new THREE.MeshBasicMaterial({color:0x3a2a26});
  const plane=new THREE.PlaneGeometry(2.1,0.85);
  for(const [along,side] of [[18.9,1],[10.0,-1]]){
    const g=new THREE.Group();
    const x=c.dx*along+c.px*2.6*side,z=c.dz*along+c.pz*2.6*side;
    g.position.set(x,groundY(x,z),z); g.rotation.y=Math.atan2(c.px,c.pz)+0.6;
    add(new THREE.CylinderGeometry(0.08,0.11,2.4,10),0x5d5a57,0,1.2,0,g);
    add(rbox(2.3,1.02,0.26,0.1),0x2c2724,0,2.75,0,g);
    const f1=add(plane,face,0,2.75,0.135,g,false), f2=add(plane,face,0,2.75,-0.135,g,false); f2.rotation.y=Math.PI;
    add(new THREE.SphereGeometry(0.13,12,10),lamp,0,3.38,0,g,false);
    scene.add(g);
  }
  return {t,lamp,key:''};

const NODES=[],NODE={};
function node(name,x,z){const n={name,x,z,adj:[]};NODES.push(n);if(name)NODE[name]=n;return n;}
function link(a,b){a.adj.push(b);b.adj.push(a);}

const L=(a,b)=>link(NODE[a],NODE[b]);
['PN-PE','PE-PS','PS-PW','PW-PN','PN-IN','PE-IE','PS-IS','PW-IW','IN-ON','IE-OE','IS-OS','IW-OW','PE-T','PS-BW','PS-BE'].forEach(e=>L(...e.split('-')));

  const k=15.28,ring=[NODE.ON,node('',8,-18.3),node('',k,-k),node('',18.3,-8),NODE.OE,node('',18.3,8),node('',k,k),node('',8,18.3),
    NODE.OS,node('',-8,18.3),node('',-k,k),node('',-18.3,8),NODE.OW,node('',-18.3,-8),node('',-k,-k),node('',-8,-18.3)];
  ring.forEach((n,i)=>link(n,ring[(i+1)%ring.length]));
}
function path(a,b){ // dijkstra
  const dist=new Map(NODES.map(n=>[n,Infinity])),prev=new Map(),todo=new Set(NODES);dist.set(a,0);
  while(todo.size){let u=null;for(const n of todo)if(!u||dist.get(n)<dist.get(u))u=n;todo.delete(u);if(u===b)break;
    for(const v of u.adj){const d=dist.get(u)+Math.hypot(u.x-v.x,u.z-v.z);if(d<dist.get(v)){dist.set(v,d);prev.set(v,u);}}}
  const out=[];for(let n=b;n;n=prev.get(n))out.unshift(n);return out;
}
const nearestNode=(x,z)=>NODES.reduce((b,n)=>Math.hypot(n.x-x,n.z-z)<Math.hypot(b.x-x,b.z-z)?n:b);
const dst=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
function routeTo(w,x,z){
  const tgt={x,z};
  if(dst(w,tgt)<4){w.route=[tgt];return;}
  const p=path(nearestNode(w.x,w.z),nearestNode(x,z)).map(n=>({x:n.x,z:n.z}));
  if(p.length>1&&dst(w,p[1])<=dst(p[0],p[1]))p.shift();
  if(p.length>1&&dst(tgt,p[p.length-2])<=dst(p[p.length-1],p[p.length-2]))p.pop();
  p.push(tgt); w.route=p;
}

function animPerson(p,moving,dt){
  if(moving)p.phase+=dt*9;

  p.legs[0].rotation.x+=(sw-p.legs[0].rotation.x)*0.3;p.legs[1].rotation.x+=(-sw-p.legs[1].rotation.x)*0.3;
  p.arms[0].rotation.x+=(-sw*0.8-p.arms[0].rotation.x)*0.3;p.arms[1].rotation.x+=(sw*0.8-p.arms[1].rotation.x)*0.3;
  p.body.position.y=moving?Math.abs(Math.sin(p.phase))*0.05:0;
  if(p.pet)p.pet.position.y=moving?Math.abs(Math.sin(p.phase*1.3))*0.08:0;
}
const lerpAng=(a,b,t)=>a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*t;
function stepWalker(w,dt,speed){
  if(!w.route.length)return false;
  const t=w.route[0],dx=t.x-w.x,dz=t.z-w.z,d=Math.hypot(dx,dz),st=speed*dt;
  if(d>0.01)w.heading=Math.atan2(dx,dz);
  if(d<=st){w.x=t.x;w.z=t.z;w.route.shift();}else{w.x+=dx/d*st;w.z+=dz/d*st;}
  return true;
}
function placeWalker(w,dt){
  const r=w.p.root;r.position.x=w.x;r.position.z=w.z;
  r.position.y+=(groundY(w.x,w.z)-r.position.y)*Math.min(1,dt*12);
  r.rotation.y=lerpAng(r.rotation.y,w.heading,Math.min(1,dt*10));
}

    if(ix||iz){
      stopTour();player.route=[];const az=controls.getAzimuthalAngle();
      let mx=Math.cos(az)*ix+Math.sin(az)*iz,mz=-Math.sin(az)*ix+Math.cos(az)*iz;const l=Math.hypot(mx,mz);mx/=l;mz/=l;
      player.x+=mx*4.2*dt;player.z+=mz*4.2*dt;const r=Math.hypot(player.x,player.z);if(r>33){player.x*=33/r;player.z*=33/r;}
      player.heading=Math.atan2(mx,mz);moving=true;
    }else moving=stepWalker(player,dt,4);
  }
  placeWalker(player,dt);animPerson(player.p,moving,dt);
  marker.visible=!player.inToilet;marker.position.set(player.p.root.position.x,player.p.root.position.y+(player.kind==='kid'?1.8:2.3)+Math.sin(time*3)*0.12,player.p.root.position.z);marker.rotation.y+=dt*2;

  // npcs
  for(const w of npcs){
    if(w.hidden)continue;
    if(w.wait>0){w.wait-=dt;animPerson(w.p,false,dt);placeWalker(w,dt);continue;}
    const m=stepWalker(w,dt,w.speed);
    if(!m){
      if(w.goToilet&&dst(w,NODE.T)<0.2){w.goToilet=false;const i=pickStall(w.kind,w.extra);
        if(i>=0){Object.assign(stalls[i],{occ:true,t:7+rand()*9,who:w});w.hidden=true;w.p.root.visible=false;wcDirty=true;w.route=[{x:NODE.T.x,z:NODE.T.z+1.2}];continue;}}
      npcNext(w);
    }
    placeWalker(w,dt);animPerson(w.p,m,dt);
  }

  // crossings + signs
  crossOcc.fill(false);
  for(const w of [player,...npcs]){if((w===player&&player.inToilet)||w.hidden)continue;const i=crossingAt(w.x,w.z);if(i>=0)crossOcc[i]=true;}
  const on=Math.floor(time*3)%2===0;
  signs.forEach((s,i)=>drawSign(s,crossOcc[i],on));
  updateCars(dt);

  // smoke
  if(smoker.smoking){puffT-=dt;if(puffT<=0){puffT=0.16;const p=puffs.find(q=>q.life<=0);if(p){tip.getWorldPosition(tmpV);p.m.position.copy(tmpV);p.life=2.4;}}}
  for(const p of puffs){if(p.life<=0){p.m.material.opacity=0;continue;}p.life-=dt;const k=1-p.life/2.4;
    p.m.position.y+=dt*0.75;p.m.position.x+=dt*0.25*Math.sin(time+k*4);p.m.scale.setScalar(0.06+k*0.32);p.m.material.opacity=0.65*(1-k);}
  cig.visible=smoker.smoking;
  if(!smoker.smoking&&!touring){smoker.relight-=dt;if(smoker.relight<=0)smoker.smoking=true;}
  smoker.p.arms[1].rotation.x+=((smoker.smoking?-2.2:-0.2)-smoker.p.arms[1].rotation.x)*Math.min(1,dt*4);
  smoker.p.body.position.y=Math.sin(time*1.4)*0.01;

  // broadcast
  if(bcT>0){
    bcT-=dt;bcWave-=dt;
    if(bcWave<=0){bcWave=0.45;speakers.forEach(s=>spawnWave(s.x,s.y,s.z,0xf08a3c));}
    banner.position.y=8.5+Math.sin(time*2)*0.2;
    if(smoker.smoking&&bcT<4.6){smoker.smoking=false;smoker.relight=45;smoker.bubble=3.5;}
    if(bcT<=0)banner.visible=false;
  }
  if(smoker.bubble>0){smoker.bubble-=dt;bubble.visible=smoker.bubble>0;}
  phCool=Math.max(0,phCool-dt);
  for(let i=waves.length-1;i>=0;i--){const w=waves[i];w.t+=dt;const s=0.3+w.t*w.grow;w.m.scale.set(s,s,s);w.m.material.opacity=0.9*(1-w.t/w.life);
    if(w.t>=w.life){scene.remove(w.m);w.m.material.dispose();waves.splice(i,1);}}

  drop.position.y=PARK_Y+1.3+Math.sin(time*2.4)*0.08;

  updateToilet(dt);
  if(wcDirty){wcDirty=false;drawBoard();}
  if(capTimer>0){capTimer-=dt;if(capTimer<=0&&!touring)cap.hidden=true;}
  uiT-=dt;if(uiT<=0){uiT=0.2;updateUI();}

  if(camAnim){camAnim.t+=dt;let k=Math.min(1,camAnim.t/camAnim.dur);k=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);controls.target.lerpVectors(camAnim.t0,camAnim.t1,k);if(k>=1)camAnim=null;}
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
caption('歡迎','延平公園智慧示範區','按「自動導覽」看完三項功能，或自己選角色在公園裡走走。',7);

// redraw canvas text once web fonts arrive
if(document.fonts)document.fonts.ready.then(()=>{drawQR();signs.forEach(s=>s.key='');wcDirty=true;banner.userData.redraw();bubble.userData.redraw();});
})();
</script>
